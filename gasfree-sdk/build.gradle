plugins {
    id ("com.android.library")
    id ("maven-publish")
    id("org.jetbrains.kotlin.android")
    id ("com.google.protobuf")
}
group = 'org.tron'
android {
    compileSdk 34
    namespace = "org.tron.gasfree"
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 6
        versionName "1.1.1"
        multiDexEnabled true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        aarMetadata {
            minCompileSdk = 21
        }
    }
    dexOptions {
        javaMaxHeapSize "4g"
        preDexLibraries = false
        additionalParameters += '--multi-dex'
        additionalParameters += '--set-max-idx-number=35000'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}
//repositories {
//    flatDir {
//        dirs 'libs'
//    }
//}
dependencies {
    // Required by the AppCompat theme bundled with this AAR.
    implementation 'androidx.appcompat:appcompat:1.2.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    implementation 'com.google.code.gson:gson:2.11.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'

    // The core is consumed as a bare AAR, so its dependencies must be explicit.
    // AddressUtil/Sha256Hash/ByteArray need Guava and protobuf ByteString.
    implementation 'com.google.guava:guava:33.3.1-android'
    implementation 'com.google.protobuf:protobuf-java:3.25.8'

    implementation 'com.github.TronLink:tronlink-android-core:1.0.14@aar'

}

publishing {

    publications {
        release(MavenPublication) {
            groupId = 'com.github.Gasfreeio'
            version = "${android.defaultConfig.versionName}"
            artifactId 'gasfree-sdk'
            print(components)
            afterEvaluate {
                from components.release
            }
        }
    }
}
